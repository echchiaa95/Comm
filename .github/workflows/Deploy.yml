
name: E-Commerce Pro Ultimate - ZIP Runner

on:
  push:
    paths:
      - "*.zip"
      - "project.zip"
      - ".github/workflows/run-zip-project.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-project:
    name: Extract, Install, Build and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find project ZIP
      - name: Find ZIP archive
        shell: bash
        run: |
          set -e

          if [ -f "project.zip" ]; then
            ZIP_FILE="project.zip"
          else
            mapfile -t ZIP_FILES < <(
              find . -maxdepth 1 -type f -iname "*.zip" | sort
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "::error::No ZIP archive found in repository root."
              echo "Please upload project.zip to the repository root."
              echo "Repository files:"
              ls -la
              exit 1
            fi

            if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
              echo "::error::Multiple ZIP archives found."
              echo "Keep only one ZIP or rename the required archive to project.zip."
              printf '%s\n' "${ZIP_FILES[@]}"
              exit 1
            fi

            ZIP_FILE="${ZIP_FILES[0]}"
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Selected archive: $ZIP_FILE"

      # 3. Validate ZIP archive
      - name: Validate ZIP archive
        run: |
          set -e
          unzip -t "$ZIP_FILE"
          echo "ZIP archive is valid."

      # 4. Extract project
      - name: Extract project
        run: |
          set -e
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Project extracted successfully."

      # 5. Locate package.json
      - name: Locate application
        shell: bash
        run: |
          set -e

          mapfile -t PACKAGE_FILES < <(
            find extracted \
              -maxdepth 6 \
              -type f \
              -name package.json \
              -not -path "*/node_modules/*" \
              | sort
          )

          if [ "${#PACKAGE_FILES[@]}" -eq 0 ]; then
            echo "::error::package.json not found inside ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Found package.json files:"
          printf '%s\n' "${PACKAGE_FILES[@]}"

          PROJECT_DIR=$(dirname "${PACKAGE_FILES[0]}")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project: $PROJECT_DIR"

      # 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 7. Install dependencies
      - name: Install dependencies
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # 8. Verify package scripts
      - name: Inspect package scripts
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          node -e "
            const p = require('./package.json');
            console.log(JSON.stringify(p.scripts || {}, null, 2));
          "

      # 9. TypeScript check when available
      - name: TypeScript validation
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if node -e "
            const p = require('./package.json');
            process.exit(p.scripts?.typecheck ? 0 : 1);
          "; then
            npm run typecheck
          else
            echo "No typecheck script configured. Skipping."
          fi

      # 10. Build application
      - name: Build application
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          set -e

          node -e "
            const p = require('./package.json');
            if (!p.scripts?.build) {
              console.error('Build script is missing!');
              process.exit(1);
            }
          "

          npm run build

      # 11. Check build output
      - name: Verify build output
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -d dist ]; then
            echo "Vite build output found."
            du -sh dist
          elif [ -d build ]; then
            echo "Build output found."
            du -sh build
          else
            echo "::error::Build completed but dist/build folder was not found."
            exit 1
          fi

      # 12. Check Supabase migrations
      - name: Validate Supabase migrations
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -d supabase/migrations ]; then
            COUNT=$(find supabase/migrations \
              -maxdepth 1 -type f -name "*.sql" | wc -l)

            echo "SQL migrations: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "::error::No SQL migrations found."
              exit 1
            fi
          else
            echo "Supabase migrations folder not found."
          fi

      # 13. Check Supabase Edge Functions
      - name: Validate Edge Functions
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -d supabase/functions ]; then
            COUNT=$(find supabase/functions \
              -type f -name "index.ts" | wc -l)

            echo "Edge Functions found: $COUNT"
          else
            echo "Supabase Edge Functions folder not found."
          fi

      # 14. Upload build artifacts
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-pro-build
          path: |
            ${{ env.PROJECT_DIR }}/dist
            ${{ env.PROJECT_DIR }}/build
          if-no-files-found: warn
          retention-days: 7

      # 15. Final report
      - name: Final report
        if: always()
        run: |
          echo "================================"
          echo "E-COMMERCE PRO ULTIMATE"
          echo "================================"
          echo "ZIP extraction: completed if previous step passed"
          echo "Dependency installation: check logs"
          echo "TypeScript validation: check logs"
          echo "Application build: check logs"
          echo "Supabase structure: check logs"
          echo "Remote database tests: not executed"
          echo "Stripe integration: not executed"
          echo "================================"
