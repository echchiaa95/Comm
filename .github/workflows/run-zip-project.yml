
name: E-Commerce Pro Ultimate - Build and Deploy

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/run-zip-project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-pages
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP archive
        shell: bash
        run: |
          set -e

          if [ -f project.zip ]; then
            ZIP_FILE=project.zip
          else
            mapfile -t FILES < <(find . -maxdepth 1 -iname "*.zip" -type f)

            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "::error::Upload exactly one ZIP file or name it project.zip"
              exit 1
            fi

            ZIP_FILE="${FILES[0]}"
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate and extract ZIP
        run: |
          set -e
          unzip -t "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate project
        shell: bash
        run: |
          set -e

          mapfile -t FILES < <(
            find extracted -maxdepth 6 -name package.json \
              -not -path "*/node_modules/*" -type f | sort
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "${FILES[0]}")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages base path
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          repo = os.environ["REPO_NAME"]
          base = f"/{repo}/"

          vite = Path("vite.config.ts")
          content = vite.read_text()

          if "base:" not in content:
              content = content.replace(
                  "export default defineConfig({",
                  f'export default defineConfig({{\n  base: "{base}",',
                  1
              )
              vite.write_text(content)

          main = Path("src/main.tsx")
          content = main.read_text()

          old = 'const prefix = window.location.pathname.match(/^\\/(en|fr|ar)(?=\\/|$)/)?.[0] ?? "";'
          new = '''const basePath = import.meta.env.BASE_URL.replace(/\\/$/, "");
          const relativePath = window.location.pathname.startsWith(basePath)
            ? window.location.pathname.slice(basePath.length)
            : window.location.pathname;
          const prefix = relativePath.match(/^\\/(en|fr|ar)(?=\\/|$)/)?.[0] ?? "";
          const routerBase = `${basePath}${prefix}`;'''

          if old in content:
              content = content.replace(old, new)
              content = content.replace(
                  '<BrowserRouter basename={prefix}>',
                  '<BrowserRouter basename={routerBase}>'
              )
              main.write_text(content)

          html = Path("index.html")
          content = html.read_text()
          content = content.replace(
              'href="/manifest.webmanifest"',
              'href="%BASE_URL%manifest.webmanifest"'
          )
          content = content.replace(
              'href="/icon.svg"',
              'href="%BASE_URL%icon.svg"'
          )
          html.write_text(content)

          print("GitHub Pages base path configured:", base)
          PY

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript validation
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: npm run typecheck

      - name: Build application
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify build
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          test -f dist/index.html
          echo "Build output verified."
          du -sh dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    name: Publish Website
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display website URL
        run: |
          echo "## E-Commerce Pro Ultimate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Website successfully published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open your website](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
